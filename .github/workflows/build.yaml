name: build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
    contents: write

env:
  AlpineDotnet: /home/runner/work/EnvToJson/EnvToJson/.dotnet

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: setup cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      - name: dotnet restore
        run: dotnet restore
      - name: dotnet build
        run: dotnet build --configuration Release --no-restore
      - name: dotnet test
        run: dotnet test --configuration Release --no-restore --verbosity normal

  publish:
    name: publish (${{ matrix.variant }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - variant: x86_64
            runner: ubuntu-latest
            musl: false
            test_image: ubuntu:24.04
          - variant: x86_64-musl
            runner: ubuntu-latest
            musl: true
            test_image: alpine:3.21
          - variant: aarch64
            runner: ubuntu-24.04-arm
            musl: false
            test_image: ubuntu:24.04
          - variant: aarch64-musl
            runner: ubuntu-24.04-arm
            musl: true
            test_image: alpine:3.21
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup alpine
        if: matrix.musl
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.21
          packages: >
            bash
            build-base
            ca-certificates-bundle
            clang
            git
            icu-libs
            libgcc
            libssl3
            libstdc++
            zip
            zlib
            zlib-dev
      - name: git config
        if: matrix.musl
        run: git config --global --add safe.directory "$(pwd)"
        shell: alpine.sh --root {0}
      - name: setup dotnet
        if: ${{ !matrix.musl }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: setup cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      - name: setup dotnet (alpine)
        if: matrix.musl
        env:
          DOTNET_ROOT: ${{ env.AlpineDotnet }}
        run: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x ./dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --no-path --install-dir "${{ env.AlpineDotnet }}"
          ./.dotnet/dotnet --info
        shell: alpine.sh --root {0}
      - name: dotnet restore
        if: ${{ !matrix.musl }}
        run: dotnet restore
      - name: dotnet restore (alpine)
        if: matrix.musl
        env:
          DOTNET_ROOT: ${{ env.AlpineDotnet }}
        run: dotnet restore
        shell: alpine.sh --root {0}
      - name: dotnet publish
        if: ${{ !matrix.musl }}
        run: |
          rm -rf artifacts/publish
          dotnet publish --configuration Release -p:DebugType=None
          zip --recurse-paths --junk-paths EnvToJson-linux-${{ matrix.variant }}.zip artifacts/publish/EnvToJson/release
      - name: dotnet publish (alpine)
        if: matrix.musl
        env:
          DOTNET_ROOT: ${{ env.AlpineDotnet }}
        run: |
          rm -rf artifacts/publish
          ./.dotnet/dotnet publish --configuration Release -p:DebugType=None
          zip --recurse-paths --junk-paths EnvToJson-linux-${{ matrix.variant }}.zip artifacts/publish/EnvToJson/release
        shell: alpine.sh --root {0}
      - name: test binary (docker)
        run: |
          BIN="$(pwd)/artifacts/publish/EnvToJson/release/EnvToJson"
          chmod +x "$BIN"

          # basic: environment variable appears in output
          OUT=$(docker run --rm -v "$BIN:/EnvToJson:ro" \
            -e HELLO=world \
            "${{ matrix.test_image }}" /EnvToJson)
          echo "$OUT"
          echo "$OUT" | grep -q '"HELLO": "world"' || { echo "FAIL: basic"; exit 1; }

          # prefix: strips prefix, excludes other variables
          OUT=$(docker run --rm -v "$BIN:/EnvToJson:ro" \
            -e APP__KEY=val -e OTHER=ignored \
            "${{ matrix.test_image }}" /EnvToJson --prefix APP__)
          echo "$OUT"
          echo "$OUT" | grep -q '"KEY": "val"' || { echo "FAIL: prefix key"; exit 1; }
          if echo "$OUT" | grep -q '"APP"';   then echo "FAIL: prefix not stripped"; exit 1; fi
          if echo "$OUT" | grep -q '"OTHER"'; then echo "FAIL: OTHER not excluded"; exit 1; fi

          # nested: double-underscore produces nested objects
          OUT=$(docker run --rm -v "$BIN:/EnvToJson:ro" \
            -e DB__HOST=localhost -e DB__PORT=5432 \
            "${{ matrix.test_image }}" /EnvToJson --prefix DB__)
          echo "$OUT"
          echo "$OUT" | grep -q '"HOST": "localhost"' || { echo "FAIL: nested HOST"; exit 1; }
          echo "$OUT" | grep -q '"PORT": "5432"'      || { echo "FAIL: nested PORT"; exit 1; }

          # schema: invalid input must exit non-zero
          echo '{"type":"object","required":["MISSING"]}' > /tmp/test-schema.json
          docker run --rm -v "$BIN:/EnvToJson:ro" -v /tmp/test-schema.json:/schema.json:ro \
            -e KEY=val \
            "${{ matrix.test_image }}" /EnvToJson --schema /schema.json \
            && { echo "FAIL: expected non-zero exit for schema violation"; exit 1; } || true

          echo "All docker tests passed"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnvToJson-linux-${{ matrix.variant }}
          path: artifacts/publish/EnvToJson/release/
      - name: upload release artifact
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} EnvToJson-linux-${{ matrix.variant }}.zip
