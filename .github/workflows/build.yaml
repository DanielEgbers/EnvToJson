name: build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
    contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: setup cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      - name: dotnet restore
        run: dotnet restore
      - name: dotnet build
        run: dotnet build --configuration Release --no-restore
      - name: dotnet test
        run: dotnet test --configuration Release --no-restore --verbosity normal

  publish:
    name: publish (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    env:
      TEST_IMAGE: ubuntu
      SUFFIX: ''
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - &checkout
        name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - &setup-cache
        name: setup cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: dotnet restore
        run: dotnet restore
      - name: dotnet publish
        run: |
          rm -rf artifacts/publish
          dotnet publish --configuration Release -p:DebugType=None
          zip --recurse-paths --junk-paths EnvToJson-linux-${{ matrix.arch }}.zip artifacts/publish/EnvToJson/release
      - &test-binary
        name: test binary (docker)
        run: |
          BIN="$(pwd)/artifacts/publish/EnvToJson/release/EnvToJson"
          sudo chmod +x "$BIN"

          # basic: environment variable appears in output
          OUT=$(docker run --rm -v "$BIN:/EnvToJson:ro" \
            -e HELLO=world \
            "${{ env.TEST_IMAGE }}" /EnvToJson)
          echo "$OUT"
          echo "$OUT" | grep -q '"HELLO": "world"' || { echo "FAIL: basic"; exit 1; }

          # prefix: strips prefix, excludes other variables
          OUT=$(docker run --rm -v "$BIN:/EnvToJson:ro" \
            -e APP__KEY=val -e OTHER=ignored \
            "${{ env.TEST_IMAGE }}" /EnvToJson --prefix APP__)
          echo "$OUT"
          echo "$OUT" | grep -q '"KEY": "val"' || { echo "FAIL: prefix key"; exit 1; }
          if echo "$OUT" | grep -q '"APP"';   then echo "FAIL: prefix not stripped"; exit 1; fi
          if echo "$OUT" | grep -q '"OTHER"'; then echo "FAIL: OTHER not excluded"; exit 1; fi

          # nested: double-underscore produces nested objects
          OUT=$(docker run --rm -v "$BIN:/EnvToJson:ro" \
            -e DB__HOST=localhost -e DB__PORT=5432 \
            "${{ env.TEST_IMAGE }}" /EnvToJson --prefix DB__)
          echo "$OUT"
          echo "$OUT" | grep -q '"HOST": "localhost"' || { echo "FAIL: nested HOST"; exit 1; }
          echo "$OUT" | grep -q '"PORT": "5432"'      || { echo "FAIL: nested PORT"; exit 1; }

          # schema: invalid input must exit non-zero
          echo '{"type":"object","required":["MISSING"]}' > /tmp/test-schema.json
          docker run --rm -v "$BIN:/EnvToJson:ro" -v /tmp/test-schema.json:/schema.json:ro \
            -e KEY=val \
            "${{ env.TEST_IMAGE }}" /EnvToJson --schema /schema.json \
            && { echo "FAIL: expected non-zero exit for schema violation"; exit 1; } || true

          echo "All docker tests passed"

      - &upload-artifact
        name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: EnvToJson-linux-${{ matrix.arch }}${{ env.SUFFIX }}
          path: artifacts/publish/EnvToJson/release/
      - &upload-release
        name: upload release artifact
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} EnvToJson-linux-${{ matrix.arch }}${{ env.SUFFIX }}.zip

  publish-musl:
    name: publish (${{ matrix.arch }}-musl)
    needs: test
    runs-on: ubuntu-24.04
    env:
      TEST_IMAGE: alpine
      SUFFIX: -musl
      ALPINE_DOTNET: /home/runner/work/EnvToJson/EnvToJson/.dotnet
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - *checkout
      - name: setup alpine
        uses: jirutka/setup-alpine@v1
        with:
          branch: latest-stable
          arch: ${{ matrix.arch }}
          packages: >
            bash
            build-base
            ca-certificates-bundle
            clang
            git
            icu-libs
            libgcc
            libssl3
            libstdc++
            zip
            zlib
            zlib-dev
      - name: git config
        run: git config --global --add safe.directory "$(pwd)"
        shell: alpine.sh --root {0}
      - *setup-cache
      - name: setup dotnet
        env:
          DOTNET_ROOT: ${{ env.ALPINE_DOTNET }}
        run: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x ./dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --no-path --install-dir "${{ env.ALPINE_DOTNET }}"
          ./.dotnet/dotnet --info
        shell: alpine.sh --root {0}
      - name: dotnet restore
        env:
          DOTNET_ROOT: ${{ env.ALPINE_DOTNET }}
        run: $DOTNET_ROOT/dotnet restore
        shell: alpine.sh --root {0}
      - name: dotnet publish
        env:
          DOTNET_ROOT: ${{ env.ALPINE_DOTNET }}
        run: |
          rm -rf artifacts/publish
          ./.dotnet/dotnet publish --configuration Release -p:DebugType=None
          zip --recurse-paths --junk-paths EnvToJson-linux-${{ matrix.arch }}-musl.zip artifacts/publish/EnvToJson/release
        shell: alpine.sh --root {0}
      - *test-binary
      - *upload-artifact
      - *upload-release
